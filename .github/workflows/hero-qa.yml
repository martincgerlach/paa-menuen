name: Forsidens hero og billedskift – browsertest

on:
  push:
    branches: [hero-inviting-polish, forside-billedskift]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-and-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8018 --bind 127.0.0.1 > /tmp/paa-menuen-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8018/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/paa-menuen-http.log
          exit 1
      - name: Check homepage hero across all screen sizes
        env:
          QA_URL: http://127.0.0.1:8018/
          QA_OUTPUT: qa-hero
        run: node tests/hero-qa.cjs
      - name: Check all site layouts and recipe images
        env:
          QA_URL: http://127.0.0.1:8018/
          QA_OUTPUT: qa-layout
        run: node tests/layout-viewport.cjs
      - name: Upload screenshots and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-layout-qa
          path: |
            qa-hero/
            qa-layout/
          retention-days: 7
          if-no-files-found: warn
