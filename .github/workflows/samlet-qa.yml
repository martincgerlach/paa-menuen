name: Samlet test af billedskift og ingredienssøgning

on:
  push:
    branches: [samlet-test-billedskift-soegning]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samlet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test søgelogik
        run: node --experimental-default-type=module --test tests/logic.test.mjs
      - name: Gennemgå hver eneste ingrediens fra DummyJSON
        run: node --experimental-default-type=module tests/ingredient-search-live.mjs
      - name: Installér Playwright og Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start hjemmesiden lokalt
        run: |
          python3 -m http.server 8018 --bind 127.0.0.1 > /tmp/paa-menuen.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8018/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test billedskift og forsiden på mobil og desktop
        env:
          QA_URL: http://127.0.0.1:8018/
          QA_OUTPUT: qa-hero
        run: node tests/hero-qa.cjs
      - name: Test danske ingredienser på alle sider
        env:
          QA_URL: http://127.0.0.1:8018/
        run: node tests/search-qa.cjs
      - name: Test navigationsikoner
        env:
          QA_URL: http://127.0.0.1:8018/
          QA_OUTPUT: qa-navigation
        run: node tests/navigation-icon-qa.cjs
      - name: Test responsive layouts på alle syv sider
        env:
          QA_URL: http://127.0.0.1:8018/
          QA_OUTPUT: qa-layout
        run: node tests/layout-viewport.cjs
      - name: Gem screenshots og ingrediensoversigt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samlet-test-beviser
          path: |
            qa-hero/
            qa-layout/
            qa-navigation/
            qa-search/
          if-no-files-found: warn
          retention-days: 14
